const normalizeText=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ');

 // Never score URLs, API queries, provenance or the supplied input itself as returned content.

 const matchedLocation=locationParts.filter(term=>containsPhrase(content,term));
 const orgMatched=containsPhrase(content,organization);
 if(nameMatched)reasons.push('Supplied name appears in the returned title or summary.');
 if(matchedLocation.length)reasons.push('Returned content mentions location text: '+matchedLocation.join(', ')+'.');
 else if(locationParts.length)reasons.push('Supplied location was not found in the returned content; this is not a confirmed mismatch.');
 if(orgMatched)reasons.push('Returned content mentions the supplied organization.');
 else if(organization)reasons.push('Supplied organization was not found in the returned content.');
 if(d.lookupMethod==='Exact username / direct profile')return {group:'profile',score:80+(nameMatched?5:0)+(matchedLocation.length?5:0)+(orgMatched?5:0),label:'Direct profile match',reasons:['Source returned a profile for the queried username. Identity remains unconfirmed.',...reasons]};

function rankedEvidence(search){

async function runBrowserSources(values,signal,fetcher=fetch){

});

 if(event.target.id==='show-broad'){includeBroad=event.target.checked;render();}
 if(event.target.id==='graph-filter'){filter=event.target.value;render();}
 if(event.target.id==='import')try{const file=event.target.files[0];if(!file)return;if(file.size>15_000_000)throw new Error('History file is too large.');const rows=parseImport(await file.text()),existing=new Set(saved.map(s=>s.id));for(const s of rows)if(existing.has(s.id))s.id=uid();await storage.importCases(rows.map(persistentCopy));saved=await storage.loadCases();view='history';render();toast('History imported.');}catch(error){toast(error.message);}
});
try{await Promise.race([(async()=>{await storage.openStorage();saved=await storage.loadCases();})(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Browser storage took too long to open.')),5000))]);}catch(error){saveError='Browser storage unavailable. Results can be viewed but history cannot be saved.';}
render();

function manualPanel(){
 const links=manualLinks(current);
 return `<details class="panel manual-panel" ><summary>Manual checks <span>${links.length} links · not checked automatically</span></summary><p>These are suggested addresses and searches, not found profiles or evidence. Open a page to inspect it; you can then save your own observation.</p><div class="manual-grid">${links.map(l=>`<article><div><strong>${esc(l.source)}</strong><small>${esc(l.kind)} · Not checked</small></div>${sourceLink(l.url,'Open')}<button class="text-button" data-review="${esc(l.url)}">Record observation</button></article>`).join('')||'<p>Add a username, name or profile link to prepare checks.</p>'}</div></details>`;
}

function evidenceCard({e,rank}){
 return `<article class="panel evidence"><div class="source-label">${esc(e.source)}<span>${esc(rank.label)}</span></div><h2>${esc(e.title)}</h2><p>${esc(e.summary)}</p><details class="rank-reasons"><summary>Why this result?</summary><ul>${rank.reasons.map(reason=>`<li>${esc(reason)}</li>`).join('')}</ul></details><small>Identity unconfirmed · ${when(e.retrievedAt)}</small><div class="evidence-actions">${sourceLink(e.details.url||e.url)}<button class="text-button" data-evidence="${esc(e.id)}">Details</button></div></article>`;
}

})().catch(showBootFailure);</script>
